services:
  mysql:
    image: mysql:8.0
    container_name: portfolio_generator_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: portfolio_generator
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: portfolio
    volumes:
      - portfolio_mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  portfolio_mysql_data:
